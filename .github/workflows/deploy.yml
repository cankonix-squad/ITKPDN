name: Build and deploy ITKPDN
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: itkpdn-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Prototype/itkpdn-prototype/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: Prototype/itkpdn-prototype
      - run: npm run build
        working-directory: Prototype/itkpdn-prototype
      - run: tar -czf release.tgz -C Prototype/itkpdn-prototype dist -C "$GITHUB_WORKSPACE" deploy
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tgz
          retention-days: 14
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.ITKPDN_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ITKPDN_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy and verify
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          target=root@187.77.127.202
          base=/root/cankonix-node/apps/itkpdn
          ssh "$target" "mkdir -p '$base/releases/$RELEASE_SHA'"
          scp release.tgz "$target:$base/releases/$RELEASE_SHA/release.tgz"
          ssh "$target" "cd '$base/releases/$RELEASE_SHA' && tar -xzf release.tgz && bash deploy/deploy.sh '$RELEASE_SHA'"
          curl --fail --retry 12 --retry-delay 5 --retry-all-errors https://dashboard-itkpdn.cankonix.com/healthz
